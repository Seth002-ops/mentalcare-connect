<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mecac - Healthcare Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        
        /* Ensure React content starts below the navbar */
        #root {
            padding-top: 64px; /* Match navbar height */
            min-height: 100vh;
        }
        
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- React mounts all your pages here -->
    <div id="root"></div>

    <!-- ============ FIXED TOP NAVBAR (Reduced Height) ============ -->
    <nav class="bg-[#2E7D32] shadow-md fixed top-0 left-0 right-0 z-50 h-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Left: Menu Toggle -->
                <button id="menu-toggle" class="text-white p-2 rounded-lg hover:bg-white/10 transition-all" aria-label="Open menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                
                <!-- Center: Logo & Title -->
                <div class="flex items-center gap-3">
                    <h1 class="text-xl font-bold text-white tracking-wider">MECAC</h1>
                    <a href="/">
                        <img src="/logo.PNG" alt="Mecac" class="h-10 w-auto hidden sm:block">
                    </a>
                </div>
                
                <!-- Right: Spacer for balance -->
                <div class="w-10"></div>
            </div>
        </div>
    </nav>

    <!-- ============ SIDEBAR OVERLAY ============ -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden"></div>

    <!-- ============ SLIDE-OUT SIDEBAR ============ -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out">
        <div class="bg-[#2E7D32] p-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="/logo.PNG" alt="Mecac" class="h-10 w-auto">
                <span class="text-white font-bold text-lg">Menu</span>
            </div>
            <button id="sidebar-close" class="text-white p-2 rounded-lg hover:bg-white/10 transition-all" aria-label="Close menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <nav class="p-4 space-y-1">
            <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-[#E8F5E9] hover:text-[#2E7D32] transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span class="font-medium">Dashboard</span>
            </a>
            <a href="/therapists" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-[#E8F5E9] hover:text-[#2E7D32] transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                <span class="font-medium">Browse Therapists</span>
            </a>
            <a href="/booking" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-[#E8F5E9] hover:text-[#2E7D32] transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span class="font-medium">Booking</span>
            </a>
            <hr class="my-4 border-gray-200">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-red-600 hover:bg-red-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                <span class="font-medium">Logout</span>
            </button>
        </nav>
    </aside>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarClose = document.getElementById('sidebar-close');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        menuToggle.addEventListener('click', openSidebar);
        sidebarClose.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);

        document.querySelectorAll('#sidebar a').forEach(link => {
            link.addEventListener('click', closeSidebar);
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userType');
            localStorage.removeItem('email');
            alert('Logged out successfully');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
