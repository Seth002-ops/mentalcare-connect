<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mecac connects clients, therapists, students, and universities across Kenya for secure, confidential mental health support." />
    <meta name="theme-color" content="#14532D" />
    <title>Mecac - Mental Care Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --font-display: "Fraunces", Georgia, "Times New Roman", serif;
        --font-body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      html { scroll-behavior: smooth; }

      body {
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        background: #FAF7F2;
      }

      #root { min-height: 100vh; }

      /* Boot shell shown until React takes over */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      #root:empty::after {
        content: "Mecac";
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 600;
        color: #14532D;
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }
    </style>
</head>
<body>
    <!-- React mounts all your pages here -->
    <div id="root"></div>

</html>
